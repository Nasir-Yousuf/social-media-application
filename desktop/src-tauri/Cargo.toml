[package]
name = "clearfeed-desktop"
version = "2.0.0"
description = "Clearfeed Desktop Application"
authors = ["Clearfeed Team"]
edition = "2021"

[lib]
name = "clearfeed_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
