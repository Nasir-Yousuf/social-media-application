[package]
name = "cfm1-core"
version = "1.0.0"
edition = "2021"
authors = ["Clearfeed Core Engineering"]
description = "Clearfeed Mesh (CFM1) Cryptographic & Binary Wire Protocol Core"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
sha2 = "0.10"
hkdf = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"

[dev-dependencies]
hex = "0.4"
